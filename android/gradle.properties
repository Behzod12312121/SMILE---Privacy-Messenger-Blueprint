org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode: the stronger optimiser and obfuscator. Renames and repacks the
# whole app, which makes a decompiled build far harder to read and patch. It is
# stricter about reflection, so the keep rules below are now load-bearing and
# the staging build exists to prove them before a release ever ships.
android.enableR8.fullMode=true
